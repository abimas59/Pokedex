<div class="card">
  <input placeholder="Digite o nome de um pokemon" type="text" (input)="getPokemon($any($event.target).value)">
  <div class="card__title">
    <h3>{{pokemon.name}}</h3>

  </div>
  <div class="card__body">
    <img [src]="pokemon.sprites.front_default" alt="pokemon">
  </div>
  <div class="card__stats">
    <span class="card__stats__type" *ngFor="let type of pokemon.types">{{type.type.name}}</span>

  </div>
  <p>by: <strong>Abima</strong></p>
  <h5>David <span class="love">♥</span> Lis <span class="love">♥</span></h5>
</div>
